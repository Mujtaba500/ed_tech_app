<div class="login-container">
  <form class="login-form" (ngSubmit)="onSubmit()">
    <div class="login-header">
      <h1>Login</h1>
    </div>

    <div class="form-group">
      <label for="name">Username</label>
      <input type="text" #uName="ngModel" id="username" [(ngModel)]="username" name="username" placeholder="Enter your username" required />
      <small *ngIf="(uName.touched && uName.errors?.['required'])">Required</small>
    </div>

    <div class="form-group">
      <label for="password" >Password</label>
      <input
      #pass="ngModel"
        type="password"
        [(ngModel)]="password"
        id="password"
        placeholder="Enter your password"
        name="password"
        required
        minlength="4"
      />
      <small *ngIf="(pass.touched && pass.errors?.['required']) ">Required</small>
      <small *ngIf="pass.errors?.['minlength']">Password must be 4 characters long</small>
    </div>

    <button type="submit" class="login-button">Sign in</button>

    <div class="signup-prompt">
      Don't have an account? <a routerLink="/signup">Sign up</a>
    </div>
  </form>
</div>
