
  <div class="signup-container">
    <form [formGroup]="formGroup" class="signup-form" (ngSubmit)="onSubmit()">
      <div class="signup-header">
        <h1>Sign Up</h1>
      </div>
  
      <div class="form-group">
        <label for="name">Username</label>
        <input type="text"  id="username" formControlName="username" placeholder="Enter your username" required />
        <!-- <small *ngIf="(uName.touched && uName.errors?.['required'])">Required</small> -->
        <small *ngIf="formGroup.controls['username'].touched && formGroup.controls['username'].errors?.['required']">
          Required
              </small>
      </div>
  
      <div class="form-group">
        <label for="password" >Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          formControlName="password"
        />
        <small *ngIf="formGroup.controls['username'].touched && formGroup.controls['password'].errors?.['required']">Required</small>
        <small *ngIf="formGroup.controls['username'].touched &&  formGroup.controls['password'].errors?.['minlength']" >Password must be 4 characters long</small>
      </div>

  
      <button type="submit" class="signup-button">Register</button>
  
      <div class="signup-prompt">
        Already have an account? <a routerLink="/login">Login</a>
      </div>
    </form>
  </div>
